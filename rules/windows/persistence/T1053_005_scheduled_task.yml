title: Suspicious Scheduled Task Created with Scripting Engine
id: b2c3d4e5-f6a7-8901-bcde-f12345678901
status: experimental
description: >
  Detects creation of scheduled tasks using schtasks.exe where the
  task payload includes a scripting engine such as PowerShell, wscript,
  or mshta. Legitimate scheduled tasks rarely need these engines.
  Malware uses this technique to maintain persistence across reboots.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: Olusegun Fajobi
date: 2024/01/15
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_tool:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/create'
  selection_payload:
    CommandLine|contains:
      - 'powershell'
      - 'wscript'
      - 'mshta'
      - 'certutil'
      - 'rundll32'
  filter_legitimate:
    CommandLine|contains:
      - 'MicrosoftEdge'
      - 'GoogleUpdate'
      - 'Adobe'
  condition: selection_tool and selection_payload and not filter_legitimate
falsepositives:
  - Legitimate software installers
  - IT automation and deployment tools
level: high