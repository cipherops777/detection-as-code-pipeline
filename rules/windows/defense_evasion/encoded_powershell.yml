title: PowerShell Encoded Command Execution
id: d4e5f6a7-b8c9-0123-defa-234567890123
status: experimental
description: >
  Detects PowerShell executing commands encoded in Base64 using the
  -EncodedCommand flag. Attackers encode commands to bypass simple
  string-matching security controls. While some legitimate tools use
  this, unexplained encoded PowerShell in user sessions is suspicious.
references:
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/
author: Olusegun Fajobi
date: 2024/01/15
tags:
  - attack.defense_evasion
  - attack.execution
  - attack.t1027
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - '-EncodedCommand'
      - '-enc '
      - ' -ec '
  filter_known_good:
    CommandLine|contains:
      - 'SCCM'
      - 'ConfigMgr'
      - 'IntuneManagement'
  condition: selection and not filter_known_good
falsepositives:
  - Microsoft management tools (SCCM, Intune)
  - Some legitimate automation frameworks
level: medium